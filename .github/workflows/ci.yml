name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Vet
        run: go vet ./...
      - name: Run tests
        run: go test ./... -v
      - name: Build (verify static binary compiles)
        run: CGO_ENABLED=0 go build -o dotenvleak .
